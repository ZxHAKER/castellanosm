<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR físicos · La Última Edición</title><style>body{font:16px Arial;margin:32px;color:#111}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{border:2px solid #111;padding:18px;min-height:260px;break-inside:avoid}.qr{width:170px;height:170px;float:right;margin:0 0 10px 15px}.card h2{margin:0 0 9px;font-size:23px}.card p{line-height:1.45}@media print{body{margin:12px}.grid{gap:10px}.card{min-height:230px}}</style></head><body><h1>La Última Edición · 5 puntos físicos</h1><p>Abre esta página desde la URL publicada en Render y luego imprime. Los QR se generan directamente en el navegador con la URL actual del juego.</p><div class="grid" id="grid"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const stops=[['photo','BIB-2417','Biblioteca','Deja una imagen, mapa o libro con la pista: fecha 24, lugar Barrio Central, lluvia intensa, imagen 17.'],['social','INFO-FUENTE','Aula de informática','Deja un cartel con autor, fecha, muestra y enlace de la fuente original.'],['archive','AULA-SECUENCIA','Salón de clase','Deja cuatro tarjetas: fuente primaria, medio A, cuenta viral y algoritmo.'],['relay','PATIO-NORA','Patio central','Deja un cartel con cuatro frases que inicien con N, O, R y A.'],['route','CANCHA-RUTA','Cancha','Marca tres recorridos: A pasa por norte, B pasa por agua y C usa la salida segura.']];const base=location.origin;grid.innerHTML=stops.map(([id,key,title,text],i)=>`<section class="card"><div class="qr" id="qr-${id}"></div><h2>${String(i+1).padStart(2,'0')} · ${title}</h2><p>${text}</p><p><b>Instrucción:</b> escanea el QR, escribe el código de la sala y regresa al tablero.</p></section>`).join('');if(typeof QRCode==='undefined'){grid.insertAdjacentHTML('beforebegin','<p><b>No se pudo cargar el generador QR.</b> Recarga esta página con conexión a internet.</p>')}else stops.forEach(([id,key])=>new QRCode(document.getElementById('qr-'+id),{text:`${base}/checkpoint.html?station=${id}&key=${key}`,width:170,height:170,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}));</script></body></html>
