<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR físicos · La Última Edición</title><style>body{font:16px Arial;margin:32px;color:#111}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{border:2px solid #111;padding:18px;min-height:260px;break-inside:avoid}.qr{width:170px;height:170px;float:right;margin:0 0 10px 15px}.card h2{margin:0 0 9px;font-size:23px}.card p{line-height:1.45}@media print{body{margin:12px}.grid{gap:10px}.card{min-height:230px}}</style></head><body><h1>La Última Edición · 5 puntos físicos</h1><p>Espera a que carguen los cinco QR y después imprime. Si ves “Error”, vuelve a desplegar el proyecto en Render para instalar la dependencia de QR.</p><div class="grid" id="grid"></div><script>const stops=[['photo','Biblioteca','Deja una imagen, mapa o libro con la pista: fecha 24, lugar Barrio Central, imagen 17.'],['social','Aula de informática','Deja un cartel con autor, fecha y enlace de la fuente original.'],['archive','Salón de clase','Deja cuatro tarjetas: fuente primaria, medio, cuenta viral y algoritmo.'],['relay','Patio central','Deja un cartel con cuatro frases que inicien con N, O, R y A.'],['route','Cancha','Marca tres recorridos: A por norte, B por agua y C salida segura.']];grid.innerHTML=stops.map(([id,title,text],i)=>`<section class="card"><img class="qr" id="qr-${id}" alt="Generando QR"><h2>${String(i+1).padStart(2,'0')} · ${title}</h2><p>${text}</p><p><b>Instrucción:</b> escanea el QR, escribe el código de sala y vuelve al tablero.</p></section>`).join('');stops.forEach(async([id])=>{const image=document.getElementById('qr-'+id);try{const r=await fetch('/api/qr/'+id);const data=await r.json();if(!r.ok)throw Error();image.src=data.image;image.alt='QR listo para escanear'}catch{image.alt='Error: vuelve a desplegar el proyecto'}});</script></body></html>
