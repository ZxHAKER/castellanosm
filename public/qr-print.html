<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>QR físicos · La Última Edición</title><style>body{font:15px Arial;margin:32px;color:#111}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{border:1px solid #111;padding:16px;break-inside:avoid}.card img{width:160px;height:160px;float:right;margin-left:12px}.card h2{margin:0 0 8px}.card p{line-height:1.45}@media print{body{margin:12px}.grid{gap:10px}.card{min-height:190px}}</style></head><body><h1>La Última Edición · puntos físicos</h1><p>Imprime cada tarjeta y colócala en el sitio indicado. Abre esta página desde la URL publicada en Render para generar QR que funcionen desde celulares.</p><div class="grid" id="grid"></div><script>const stops=[['photo','Biblioteca','Coloca junto a una ficha, libro o imagen.'],['social','Aula de informática','Coloca junto a un computador o cartel de fuentes.'],['archive','Salón de clase','Coloca junto a cuatro tarjetas de cronología.'],['decoder','Auditorio','Coloca cerca de un parlante o micrófono.'],['puzzle','Salón de sociales','Coloca junto a tiras de noticia desordenada.'],['detective','Rectoría','Coloca junto a un sobre de cronología.'],['relay','Patio central','Coloca junto al cartel de transmisión.'],['route','Cancha','Coloca en el punto de salida marcado.'],['vault','Laboratorio','Coloca junto a fichas de evidencia.'],['witness','Enfermería','Coloca junto a la declaración.'],['classify','Portería / salida','Coloca antes de la última puerta.']];grid.innerHTML=stops.map(([id,title,text],i)=>`<section class="card"><img src="/api/qr/${id}"><h2>${String(i+1).padStart(2,'0')} · ${title}</h2><p>${text}</p><p><b>Instrucción:</b> escanea, escribe el código de la sala y vuelve al tablero.</p></section>`).join('');</script></body></html>
