<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR físicos · La Última Edición</title><style>body{font:16px Arial;margin:32px;color:#111}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{border:2px solid #111;padding:18px;min-height:280px;break-inside:avoid}.qr{width:170px;height:170px;float:right;margin:0 0 10px 15px}.card h2{margin:0 0 9px;font-size:23px}.card p{line-height:1.45}.url{font-size:9px;word-break:break-all;color:#555}@media print{body{margin:12px}.grid{gap:10px}.card{min-height:245px}}</style></head><body><h1>La Última Edición · 5 puntos físicos</h1><p>Espera a que aparezcan los cinco QR antes de imprimir. Cada QR contiene el enlace de una estación física.</p><div class="grid" id="grid"></div><script>const stops=[['photo','BIB-2417','Biblioteca','Deja una imagen, mapa o libro con la pista: fecha 24, lugar Barrio Central, imagen 17.'],['social','INFO-FUENTE','Aula de informática','Deja un cartel con autor, fecha y enlace de la fuente original.'],['archive','AULA-SECUENCIA','Salón de clase','Deja cuatro tarjetas: fuente primaria, medio, cuenta viral y algoritmo.'],['relay','PATIO-NORA','Patio central','Deja un cartel con cuatro frases que inicien con N, O, R y A.'],['route','CANCHA-RUTA','Cancha','Marca tres recorridos: A por norte, B por agua y C salida segura.']];const base=location.origin;grid.innerHTML=stops.map(([id,key,title,text],i)=>{const target=`${base}/checkpoint.html?station=${id}&key=${key}`,qr=`https://api.qrserver.com/v1/create-qr-code/?size=400x400&format=png&data=${encodeURIComponent(target)}`;return `<section class="card"><img class="qr" src="${qr}" alt="QR de ${title}"><h2>${String(i+1).padStart(2,'0')} · ${title}</h2><p>${text}</p><p><b>Instrucción:</b> escanea el QR, escribe el código de sala y vuelve al tablero.</p><p class="url">${target}</p></section>`}).join('');</script></body></html>
