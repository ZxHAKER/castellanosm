<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Punto físico</title><link rel="stylesheet" href="dark.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.check{max-width:430px;border:1px solid #303842;background:#151a20;padding:30px}.check h1{font-size:34px}.check input{margin:18px 0}.result{min-height:20px;color:#d6a76e}</style></head><body><main class="check"><span class="eyebrow">PUNTO FÍSICO VERIFICADO</span><h1 id="title">Validando estación</h1><p id="copy">Introduce el código de la sala para entregar esta evidencia a tu equipo.</p><label>Código de sala<input id="code" maxlength="4" placeholder="A7K2" class="code-input"></label><button id="unlock" class="primary">Entregar evidencia</button><p id="result" class="result"></p></main><script src="/socket.io/socket.io.js"></script><script>const q=new URLSearchParams(location.search),station=q.get('station'),key=q.get('key'),data={photo:['Biblioteca','La ficha encontrada abre la Sala de cámaras.'],social:['Aula de informática','La fuente física abre el Nodo de fuentes.'],archive:['Salón de clase','Las tarjetas encontradas abren el Archivo roto.'],decoder:['Auditorio','La transmisión abre el Cifrado de rescate.'],puzzle:['Salón de sociales','Las tiras físicas abren la Mesa de edición.'],detective:['Rectoría','El sobre de cronología abre la Ruta de escape.'],relay:['Patio central','La transmisión encontrada abre la Radio de Nora.'],route:['Cancha','El punto marcado abre el Plano de evacuación.'],vault:['Laboratorio','Las fichas de evidencia abren la Bóveda de Lía.'],witness:['Enfermería','La declaración abre el testimonio de Ivo.'],classify:['Portería / salida','La última pista abre la Puerta final.']}[station];if(!data){document.body.innerHTML='QR no reconocido';throw 0}title.textContent=data[0];copy.textContent=data[1]+' Introduce el código de tu sala.';const s=io();unlock.onclick=()=>s.emit('physical:unlock',{code:code.value.trim().toUpperCase(),station,key},r=>result.textContent=r.ok?'Evidencia entregada. Regresa al tablero virtual.':r.error);</script></body></html>
