<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Punto físico</title><link rel="stylesheet" href="dark.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.check{max-width:430px;border:1px solid #303842;background:#151a20;padding:30px}.check h1{font-size:34px}.check input{margin:18px 0}.result{min-height:20px;color:#d6a76e}</style></head><body><main class="check"><span class="eyebrow">PUNTO FÍSICO PERSONAL</span><h1 id="title">Validando estación</h1><p id="copy">Introduce el código de tu sala para desbloquear esta actividad solo para ti.</p><label>Tu nombre en el juego<input id="name" maxlength="22" placeholder="El mismo nombre usado al entrar"></label><label>Código de sala<input id="code" maxlength="4" placeholder="A7K2" class="code-input"></label><button id="unlock" class="primary">Desbloquear mi evidencia</button><p id="result" class="result"></p></main><script src="/socket.io/socket.io.js"></script><script>const q=new URLSearchParams(location.search),station=q.get('station'),key=q.get('key'),token=localStorage.getItem('ultimaEdicionPlayerToken'),data={photo:['Biblioteca','La ficha encontrada abre la Sala de cámaras.'],social:['Aula de informática','La fuente física abre el Nodo de fuentes.'],archive:['Salón de clase','Las tarjetas encontradas abren el Archivo roto.'],relay:['Patio central','La transmisión encontrada abre la Radio de Nora.'],route:['Cancha','El punto marcado abre el Plano de evacuación.']}[station];if(!data){document.body.innerHTML='QR no reconocido';throw 0}title.textContent=data[0];copy.textContent=data[1]+' Escribe tu nombre y el código de tu sala.';const s=io();unlock.onclick=()=>s.emit('physical:unlock',{code:code.value.trim().toUpperCase(),station,key,playerToken:token,playerName:name.value.trim()},r=>result.textContent=r.ok?'Tu evidencia fue desbloqueada. Regresa a tu tablero.':r.error);</script></body></html>
